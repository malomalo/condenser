name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      # The tests install the npm packages they use into tmp/ as needed. Babel 8
      # isn't supported yet, so install Babel 7 first (saved to tmp/package.json
      # so later installs don't prune it).
      - run: npm install --silent --prefix tmp @babel/core@7 @babel/preset-env@7 @babel/plugin-transform-runtime@7 @babel/runtime-corejs3@7

      - run: bundle exec rake test
